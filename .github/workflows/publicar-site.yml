# Publica o painel como site: https://lucasrangel89.github.io/biblioteca/
#
# Roda sozinho a cada mudança em `main`. Para publicar de novo à mão: aba Actions → "Publicar o site" → Run workflow.
#
# O site é o painel pronto (Biblioteca_Lucas_Dashboard.html), servido como página inicial. Nada é gerado aqui:
# o painel é montado e testado antes de entrar em `main` (tools/atualizar.py e tools/qa/tudo.py), e o que vai
# para o site é exatamente o arquivo que está no repositório.
name: Publicar o site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read    # ler o repositório
  pages: write      # publicar no GitHub Pages
  id-token: write   # o GitHub Pages confere por aqui de onde vem a publicação

# Uma publicação por vez: a que está em andamento termina; das que ficarem esperando, só a mais recente roda.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Montar o site
        run: |
          mkdir _site
          cp Biblioteca_Lucas_Dashboard.html _site/index.html

      - name: Enviar o site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v5
