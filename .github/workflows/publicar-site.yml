# Publica o painel como site: https://lucasrangel89.github.io/biblioteca/
#
# Roda sozinho a cada mudança em `main`. Para publicar de novo à mão: aba Actions → "Publicar o site" →
# Run workflow, escolhendo `main`. Pedidos manuais em outros ramos não publicam.
#
# Antes de publicar, confere que o HTML versionado ainda é exatamente o que as fontes geram e roda os testes
# rápidos. O que vai para o site continua sendo o arquivo já commitado, não um artefato improvisado na publicação.
name: Publicar o site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read    # por padrão, só ler o repositório

# Uma publicação por vez: a que está em andamento termina; das que ficarem esperando, só a mais recente roda.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  conferir:
    name: Conferir antes de publicar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read    # a conferência não precisa publicar nada
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Conferir se os arquivos gerados estão em dia
        run: |
          python3 tools/atualizar.py
          git diff --exit-code

      - name: Conferir a sintaxe JavaScript
        run: |
          for f in src/js/*.js; do node --check "$f"; done

      - name: Rodar os testes sem navegador
        env:
          BIBLIOTECA_QA_TMP: ${{ runner.temp }}/biblioteca-qa
        run: python3 tools/qa/tudo.py importador gerar_listagens busca_capas auditoria_capas fluxo_capas capa_digital fluxo_ci

  publicar:
    name: Publicar
    needs: conferir
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read    # ler o HTML que já está no repositório
      pages: write      # publicar no GitHub Pages
      id-token: write   # o GitHub Pages confere por aqui de onde vem a publicação
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Montar o site
        run: |
          mkdir _site
          cp Biblioteca_Lucas_Dashboard.html _site/index.html

      - name: Enviar o site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v5
