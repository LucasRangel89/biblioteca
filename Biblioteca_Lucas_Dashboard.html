  let lo = Math.min(...v), hi = Math.max(...v); if (o.zero) lo = Math.min(0, lo); if (hi === lo) { hi += 1; lo -= 1; }
  const n = vals.length, X = i => 2 + i / (n - 1) * (w - 6), Y = x => 3 + (1 - (x - lo) / (hi - lo)) * (h - 6);
  let d = '', ult = null, prim = null;
  vals.forEach((x, i) => {
    if (x == null) return;
    const a = X(i).toFixed(1), b = Y(x).toFixed(1);
    if (prim == null) { prim = i; d += `M${a},${b}`; } else d += o.degrau ? `H${a}V${b}` : `L${a},${b}`;
    ult = i;
  });
  const area = o.area === false ? '' : `<path d="${d}L${X(ult).toFixed(1)},${h}L${X(prim).toFixed(1)},${h}Z" style="fill:${cor}" opacity=".12"/>`;
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${area}<path d="${d}" fill="none" style="stroke:${cor}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(ult).toFixed(1)}" cy="${Y(vals[ult]).toFixed(1)}" r="2.3" style="fill:${cor}"/></svg>`;
}

/* número que "conta" até o novo valor */
function contarAte(el, valor, fmt) {
  const de = el._v != null && isFinite(el._v) ? el._v : 0;
  if (el._a) el._a.parar();
  el._v = valor;
  if (valor == null || !isFinite(valor)) { el.textContent = '—'; return; }
  if (de === valor) { el.textContent = fmt(valor); return; }

function amostra(serie, de, ate, n) {         // reamostra uma série em degraus [[dia, valor], …] em n pontos igualmente espaçados
  const out = []; let j = 0;
  for (let k = 0; k < n; k++) {
    const d = n < 2 ? ate : de + (ate - de) * k / (n - 1);
    while (j + 1 < serie.length && serie[j + 1][0] <= d) j++;
    out.push(serie.length && serie[j][0] <= d ? serie[j][1] : serie.length ? serie[0][1] : null);

}

  else { cur = { de, ate }; ant = { de: de - n, ate: de - 1 }; cmp = p === '12m' ? 'vs. 12 meses anteriores' : `vs. ${fInt(n)} dias anteriores`; cmpC = 'no período'; }

}

/* itens com acompanhamento de preço: tudo o que está na lista de compra + recomendações monitoradas */
const rastreado = b => !!b.px && b.col !== 'acervo' && (b.col === 'desejo' || b.track);
function precoBase(b, d) {                   // melhor preço em d; antes da 1ª cotação, usa a 1ª cotação
  const m = melhorEm(b, d); if (m) return m.p;
  let p = null, dd = Infinity;
  for (const f of fontesDe(b)) { const x = b.px[f][0]; if (x && x[0] < dd) { dd = x[0]; p = x[1]; } }
  return p;
}
const temCotacaoPropria = b => !!b.px && Object.values(b.px).some(pts => pts.some(p => p[2]));

function recorte(I, o) {
  const seg = DB.livros.filter(b => passaSeg(b, Object.assign({ semAcervo: S.visao === 'recs' }, o)));
  const ac = [], des = [], rec = [];
  for (const b of seg) (b.col === 'acervo' ? ac : b.col === 'desejo' ? des : rec).push(b);
  return { seg, ac, des, rec, acP: I.tudo ? ac : ac.filter(b => dentro(adqDe(b), I)), recP: I.tudo ? rec : rec.filter(b => dentro(b.add, I)) };
}
function contexto() {
  const I = intervalo(), c = recorte(I, {});
  c.I = I; c.T = DB.hoje;
  c.lidos = c.seg.filter(b => b.leit === 'lido');
  c.lidosP = I.tudo ? c.lidos : c.lidos.filter(b => dentro(b.lidoEm, I));
  c.rast = c.seg.filter(rastreado);
  let E, DE;
  Object.defineProperty(c, 'E', { get: () => E || (E = recorte(I, { semEixo: true })) });      // ignora o filtro de eixo (gráficos-seletores)
  Object.defineProperty(c, 'DE', { get: () => DE || (DE = recorte(I, { semDE: true })) });     // ignora dificuldade/extensão (matriz)
  let ini = Infinity;
  for (const b of c.rast) for (const f in b.px) if (b.px[f].length && b.px[f][0][0] < ini) ini = b.px[f][0][0];
  c.pxIni = isFinite(ini) ? ini : I.ate;
  c.pxDe = Math.min(I.ate, Math.max(I.de, c.pxIni));       // início efetivo do recorte de preços
  c.refDe = Math.min(I.ate, Math.max(I.cur.de, c.pxIni));  // base de comparação das tendências de preço
  const cache = new Map();
  c.px = b => {
    let r = cache.get(b.id);
    if (!r) { r = b.px ? { hoje: melhorEm(b, I.ate), sit: situacaoDe(b, I.ate), res: resumoPrecos(b, c.pxDe, I.ate), ref: precoBase(b, c.refDe) } : { hoje: null, sit: 'sem', res: null, ref: null }; cache.set(b.id, r); }
    return r;
  };
  c.cestaEm = d => soma(c.des, b => (b.px ? precoBase(b, d) || 0 : 0));
  // trilhas e ordem de compra olham a biblioteca inteira (os filtros não mudam o que falta de uma trilha); só são calculadas se alguém pedir
  let TR, OC;
  Object.defineProperty(c, 'trilhas', { get: () => TR || (TR = estadoTrilhas()) });
  Object.defineProperty(c, 'compra', { get: () => OC || (OC = ordemDeCompra(c.trilhas)) });
  return c;
}

/* ───────── trilhas de leitura ─────────
   Para cada trilha: os livros (na ordem da lista; quem ganhou o marcador no painel entra no fim), quantos estão no acervo,
   quantos foram lidos e quais ainda faltam — isto é, nem estão no acervo nem foram lidos (um livro lido emprestado não falta). */
function estadoTrilhas() {
  const porTag = new Map(TRILHAS.map(t => [t.tag, []]));
  for (const b of DB.livros) for (const tg of b.tags) { const l = porTag.get(tg); if (l) l.push(b); }
  return TRILHAS.map(t => {
    const pos = new Map(t.linhas.map((k, i) => [k, i])), ord = b => (pos.has(b.o) ? pos.get(b.o) : 1e6);
    const livros = porTag.get(t.tag).sort((a, z) => ord(a) - ord(z) || a.t.localeCompare(z.t, 'pt-BR'));
    return { t, livros, n: livros.length, tenho: livros.filter(b => b.col === 'acervo').length, lidos: livros.filter(b => b.leit === 'lido').length, faltam: livros.filter(b => b.col !== 'acervo' && b.leit !== 'lido') };
  });
}

/* ───────── ordem de compra das recomendações ─────────
   Uma sugestão de por onde começar — não uma regra. Cada recomendação que ainda não está no acervo, nem na lista de compra,
   nem foi lida recebe pontos pelo que o catálogo e o painel sabem dela; quem tem mais pontos vem antes. Os motivos aparecem
   ao lado do livro, para a ordem poder ser conferida (e contestada). Nada aqui olha preço: o painel não consulta as lojas.
     · prioridade sua (#top) ............................................. 40
     · está numa trilha de leitura ....................................... 8 a 30, conforme o quanto da trilha já está feito
       (em casa ou lido); +15 se é o único livro que falta, +8 se faltam dois; +4 por trilha a mais
     · porta de entrada de uma área (#papel-porta-de-entrada) ............ 12
     · leitura-relâmpago (#papel-leitura-relampago) ...................... 6
     · leitura leve (d1) 6, média (d2) 3 · curta (e1) 6, média (e2) 3
     · sem edição em português (#sem-pt) ................................. −15
     · dados a conferir (#verificar) ..................................... −10                                            */
function ordemDeCompra(trilhas) {
  const daTrilha = new Map(trilhas.map(x => [x.t.tag, x])), lista = [];
  for (const b of DB.livros) {
    if (b.col !== 'rec' || b.leit === 'lido') continue;
    let pts = 0; const motivos = [], curtos = [];
    const soma1 = (n, longo, curto) => { pts += n; if (longo) { motivos.push(longo); curtos.push(curto || longo); } };
    if (b._top) soma1(40, 'prioridade sua (#top)', 'prioridade sua');
    const ts = b.tags.map(t => daTrilha.get(t)).filter(Boolean).map(x => ({ x, falta: x.faltam.length, feito: x.n ? (x.n - x.faltam.length) / x.n : 0 })).sort((a, z) => z.feito - a.feito || a.falta - z.falta);
    if (ts.length) {
      const { x, falta, feito } = ts[0];
      soma1(8 + Math.round(22 * feito) + (falta === 1 ? 15 : falta === 2 ? 8 : 0) + 4 * (ts.length - 1),
        (falta === 1 ? `é o que falta para fechar a trilha “${x.t.curto}”` : `trilha “${x.t.curto}”: faltam ${falta} de ${x.n}`) + (ts.length > 1 ? ` (e mais ${ts.length - 1 === 1 ? 'uma trilha' : (ts.length - 1) + ' trilhas'})` : ''),
        falta === 1 ? 'fecha uma trilha' : ts.length > 1 ? `${ts.length} trilhas` : 'trilha');
    }
    if (b.tags.includes('papel-porta-de-entrada')) soma1(12, 'porta de entrada da área');
    if (b.tags.includes('papel-leitura-relampago')) soma1(6, 'leitura-relâmpago');
    pts += (b._d === 1 ? 6 : b._d === 2 ? 3 : 0) + (b._e === 1 ? 6 : b._e === 2 ? 3 : 0);
    if (b._d === 1 && b._e === 1) { if (!b.tags.includes('papel-leitura-relampago')) soma1(0, 'leve e curta'); }
    else if (b._d === 1) soma1(0, 'leitura leve', 'leve'); else if (b._e === 1) soma1(0, 'curta');
    if (b.tags.includes('sem-pt')) soma1(-15, 'sem edição em português', 'sem edição PT');
    if (b.tags.includes('verificar')) soma1(-10, 'dados a conferir');
    lista.push({ b, pts, motivos, curtos });
  }
  lista.sort((a, z) => z.pts - a.pts || (a.b._d || 9) - (z.b._d || 9) || (a.b._e || 9) - (z.b._e || 9) || a.b._busca.localeCompare(z.b._busca));
  const de = new Map(); lista.forEach((o, i) => { o.pos = i + 1; de.set(o.b.id, o); });
  return { lista, de, total: lista.length };
}

/* agregações por período */
function idxBalde(lista, d) { let lo = 0, hi = lista.length - 1; while (lo <= hi) { const m = (lo + hi) >> 1; if (d < lista[m].i) hi = m - 1; else if (d > lista[m].f) lo = m + 1; else return m; } return -1; }
function porBalde(B, itens, dataDe, valorDe) {
  const v = new Array(B.lista.length).fill(0);
  for (const it of itens) { const d = dataDe(it); if (d == null) continue; const i = idxBalde(B.lista, d); if (i >= 0) v[i] += valorDe ? valorDe(it) : 1; }
  return v;
}
function acumulado(B, itens, dataDe, valorDe) {      // total acumulado ao fim de cada balde (inclui o que veio antes do intervalo)
  const v = new Array(B.lista.length).fill(0), ini = B.lista.length ? B.lista[0].i : 0;
  let base = 0;
  for (const it of itens) { const d = dataDe(it); if (d == null) continue; const x = valorDe ? valorDe(it) : 1; if (d < ini) base += x; else { const i = idxBalde(B.lista, d); if (i >= 0) v[i] += x; } }
  let s = base; return v.map(x => (s += x));
}
const contarPor = (arr, f) => { const m = new Map(); for (const x of arr) { const k = f(x); m.set(k, (m.get(k) || 0) + 1); } return m; };

/* tendências */
function tend(atual, ant, sentido) {         // sentido: 'alta' (subir é bom), 'baixa' (cair é bom) ou 'neutro'
  if (atual == null || ant == null || (!atual && !ant)) return null;     // nada antes e nada agora: não há tendência a mostrar
  const dif = atual - ant, dir = Math.abs(dif) < 1e-9 ? 'reta' : dif > 0 ? 'cima' : 'abaixo';
  const cls = dir === 'reta' || sentido === 'neutro' ? 'neutro' : (dir === 'cima') === (sentido === 'alta') ? 'bom' : 'ruim';
  return { dir, cls, txt: !ant ? (dif > 0 ? 'novo' : '0%') : fPct(Math.abs(dif / ant)) };
}
function tendAbs(dif, sentido, fmt) {
  const dir = Math.abs(dif) < 1e-9 ? 'reta' : dif > 0 ? 'cima' : 'abaixo';
  const cls = dir === 'reta' || sentido === 'neutro' ? 'neutro' : (dir === 'cima') === (sentido === 'alta') ? 'bom' : 'ruim';
  return { dir, cls, txt: (fmt || fInt)(Math.abs(dif)) };
}

/* busca nas lojas (links de pesquisa; o painel não consulta preços sozinho) */
function linksLojas(b) {

    ['Amazon', `https://www.amazon.com.br/s?k=${q}&i=stripbooks`],
    ['Kindle', `https://www.amazon.com.br/s?k=${q}&i=digital-text`],
    ['Estante Virtual', `https://www.estantevirtual.com.br/busca?q=${q}`],
    ['Mercado Livre', `https://lista.mercadolivre.com.br/${slug}`],
    ['Travessa', `https://www.travessa.com.br/Busca.aspx?d=1&bt=${encodeURIComponent(titulo)}`],

/* legenda das tendências de preço: o histórico pode ter começado dentro da janela de comparação (ou hoje mesmo) */

function Tabela(visao) {
  const cfg = TABELAS[visao], k = cartao({ id: 'tab-' + visao, w: 'p-12 card-tab', tit: cfg.tit });
  const estreita = !!window.matchMedia && matchMedia('(max-width: 700px)').matches, mob = cfg.mob || {};
  const st = S.tab[visao] = Object.assign({ aba: 'todos', q: '', ord: cfg.ord, dir: cfg.dir, pag: 0, tam: estreita ? 10 : 25 }, S.tab[visao]);
  const cols = cfg.cols.map(id => Object.assign({ id }, COLS[id])), vis = cols.filter(x => !x.oculto);
  for (const x of vis) x.mcls = (x.id === mob.b ? ' m-b' : (mob.x || []).includes(x.id) ? ' m-x' : mob.s && mob.s[x.id] ? ' m-' + mob.s[x.id] : '') + (cfg.red && cfg.red[x.id] ? ' r-' + cfg.red[x.id] : '');
  k.tools.innerHTML = `<label class="busca-t">${icone('busca', 15)}<input type="search" placeholder="Filtrar por título, autor ou tema" aria-label="Filtrar a tabela" value="${esc(st.q)}"></label>
    <label class="ord-m"><span>Ordenar</span><select aria-label="Ordenar por">${vis.filter(x => x.ord).map(x => `<option value="${x.id}">${esc(x.n)}</option>`).join('')}</select><button type="button" class="ib" data-dir aria-label="Inverter a ordem">${icone('cima', 15)}</button></label>
    <button type="button" class="btn sm" data-csv title="Exportar as linhas filtradas em CSV">${icone('baixar', 15)}<span>CSV</span></button>`;
  k.corpo.innerHTML = `<div class="abas" role="tablist" aria-label="Recortes rápidos"></div>
    <div class="tb-w"><table class="tb"><thead><tr>${vis.map(x => `<th scope="col" class="${x.num ? 'num ' : ''}${x.cls || ''}${cfg.red && cfg.red[x.id] ? ' r-' + cfg.red[x.id] : ''}" data-c="${x.id}"${x.dica ? ` title="${esc(x.dica)}"` : ''}>${x.ord ? `<button type="button">${esc(x.n)}<span class="so">${icone('cima', 12)}</span></button>` : esc(x.n)}</th>`).join('')}</tr></thead><tbody></tbody></table><div class="ch-vazio" hidden></div></div>`;
  k.pe.className = 'card-f tb-pe';
  k.pe.innerHTML = `<span class="tb-info"></span><div class="pag"><label class="tam"><span>por página</span><select aria-label="Linhas por página">${[10, 25, 50, 100].map(n => `<option${n === st.tam ? ' selected' : ''}>${n}</option>`).join('')}</select></label><button type="button" class="ib" data-p="-1" aria-label="Página anterior">${icone('esq', 16)}</button><span class="pag-n"></span><button type="button" class="ib" data-p="1" aria-label="Próxima página">${icone('dir', 16)}</button></div>`;
  const abasEl = $('.abas', k.corpo), tbody = $('tbody', k.corpo), vazio = $('.ch-vazio', k.corpo), busca = $('input[type=search]', k.tools), ordSel = $('.ord-m select', k.tools);
  let ctx = null, base = [], filtradas = [];

  function desenhar() {
    if (!ctx) return;
    const q = norm(st.q.trim()), termos = q ? q.split(/\s+/) : [];
    const porBusca = termos.length ? base.filter(b => termos.every(t => b._busca.includes(t))) : base;
    if (!cfg.abas.some(a => a[0] === st.aba)) st.aba = 'todos';
    setHtml(abasEl, cfg.abas.map(([id, n, f]) => { const qt = f ? porBusca.filter(b => f(b, ctx)).length : porBusca.length; return `<button type="button" role="tab" data-a="${id}" aria-selected="${st.aba === id}"${qt === 0 && st.aba !== id ? ' class="zero"' : ''}>${esc(n)}<span class="cont">${fInt(qt)}</span></button>`; }).join(''));
    const aba = cfg.abas.find(a => a[0] === st.aba);
    filtradas = aba[2] ? porBusca.filter(b => aba[2](b, ctx)) : porBusca.slice();
    const col = cols.find(x => x.id === st.ord && x.ord) || cols[0], nulo = v => v == null || v === '' || (typeof v === 'number' && isNaN(v));
    const chaves = new Map(filtradas.map(b => [b, col.ord(b, ctx)]));
    filtradas.sort((a, z) => {
      const x = chaves.get(a), y = chaves.get(z);
      if (nulo(x) || nulo(y)) return (nulo(x) ? 1 : 0) - (nulo(y) ? 1 : 0) || a._busca.localeCompare(z._busca);
      return ((typeof x === 'string' ? x.localeCompare(y, 'pt-BR') : x - y) * st.dir) || a._busca.localeCompare(z._busca);
    });
    const total = filtradas.length, pags = Math.max(1, Math.ceil(total / st.tam));
    st.pag = clamp(st.pag, 0, pags - 1);
    const fatia = filtradas.slice(st.pag * st.tam, (st.pag + 1) * st.tam);
    setHtml(tbody, fatia.map(b => `<tr data-id="${b.id}" tabindex="0"${mob.b ? ' class="tem-b"' : ''}>${vis.map(x => { const h = x.html(b, ctx); return `<td class="${x.num ? 'num ' : ''}${x.cls || ''}${x.mcls}${h === mudo ? ' vz' : ''}" data-rot="${esc(x.n)}">${h}</td>`; }).join('')}</tr>`).join(''));
    vazio.hidden = total > 0; $('table', k.corpo).style.display = total ? '' : 'none';
    if (!total) vazio.innerHTML = vazioHtml(base.length ? 'Nenhuma linha combina com a busca ou a aba escolhida.' : cfg.vazio && !nFiltros() ? cfg.vazio : ctx.I.tudo ? 'Nenhum livro com os filtros atuais.' : 'Nada neste período com os filtros atuais. Itens sem data só aparecem em “Tudo”.');
    $$('th', k.corpo).forEach(th => { const on = th.dataset.c === col.id; th.setAttribute('aria-sort', on ? (st.dir > 0 ? 'ascending' : 'descending') : 'none'); th.classList.toggle('ord', on); th.classList.toggle('desc', on && st.dir < 0); });
    ordSel.value = col.id; $('[data-dir]', k.tools).classList.toggle('desc', st.dir < 0);
    $('.tb-info', k.pe).textContent = total ? `${fInt(st.pag * st.tam + 1)}–${fInt(Math.min(total, (st.pag + 1) * st.tam))} de ${plural(total, 'livro', 'livros')}${total !== base.length ? ` (de ${fInt(base.length)} no recorte)` : ''}` : 'Nenhum livro';
    $('.pag-n', k.pe).textContent = `${st.pag + 1} / ${pags}`;
    $('[data-p="-1"]', k.pe).disabled = st.pag <= 0; $('[data-p="1"]', k.pe).disabled = st.pag >= pags - 1;
    k.sub.textContent = cfg.sub ? cfg.sub(ctx) : `Clique numa linha para abrir o livro · ${ctx.I.tudo ? 'todo o histórico' : ctx.I.rot}`;
  }
  const ordenarPor = id => { if (st.ord === id) st.dir = -st.dir; else { st.ord = id; st.dir = COLS[id].num ? -1 : 1; } st.pag = 0; desenhar(); };
  abasEl.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b) return; st.aba = b.dataset.a; st.pag = 0; desenhar(); });
  busca.addEventListener('input', debounce(() => { st.q = busca.value; st.pag = 0; desenhar(); }, 120));
  $('thead', k.corpo).addEventListener('click', e => { const th = e.target.closest('th'); if (th && e.target.closest('button')) ordenarPor(th.dataset.c); });
  ordSel.addEventListener('change', () => { st.ord = ordSel.value; st.dir = COLS[st.ord].num ? -1 : 1; st.pag = 0; desenhar(); });
  $('[data-dir]', k.tools).addEventListener('click', () => { st.dir = -st.dir; st.pag = 0; desenhar(); });
  k.pe.addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (!b || b.disabled) return; st.pag += +b.dataset.p; desenhar(); k.el.scrollIntoView({ block: 'nearest' }); });
  $('.tam select', k.pe).addEventListener('change', e => { st.tam = +e.target.value; st.pag = 0; salvar(); desenhar(); });
  tbody.addEventListener('click', e => { const tr = e.target.closest('tr[data-id]'); if (tr) abrirLivro(tr.dataset.id); });
  tbody.addEventListener('keydown', e => { if (e.key !== 'Enter' && e.key !== ' ') return; const tr = e.target.closest('tr[data-id]'); if (tr) { e.preventDefault(); abrirLivro(tr.dataset.id); } });
  $('[data-csv]', k.tools).addEventListener('click', () => {
    if (!filtradas.length) { toast('Não há linhas para exportar.', 'aviso'); return; }
    const cs = cols.filter(x => x.csv), cel = v => { const s = String(v ?? ''); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const txt = '\ufeff' + [cs.map(x => cel(x.n)).join(';')].concat(filtradas.map(b => cs.map(x => cel(x.csv(b, ctx))).join(';'))).join('\r\n');
    baixarArquivo(`biblioteca-${visao}-${iso(DB.hoje)}.csv`, txt, 'text/csv;charset=utf-8');
  });
  return { el: k.el, atualizar(c) { ctx = c; base = cfg.linhas(c); desenhar(); } };
}

/* ───────────────────────── anotações do usuário: comentários, capa enviada e arquivos anexados ─────────────────────────
   Os comentários são texto curto e ficam no próprio livro (campo `com`), junto com o resto dos dados.
   O que pesa — a imagem da capa e os arquivos (resenha, relatório…) — fica à parte, no IndexedDB (o banco de dados do
   próprio navegador): o armazenamento local, onde estão os livros, é pequeno e é regravado inteiro a cada alteração.
   No livro fica só a chave de cada anexo (`cp`, `anx`). Nada sai do dispositivo; o backup (.json) leva os anexos junto.
   Sem armazenamento (pré-visualização em sandbox) os anexos valem só enquanto a página estiver aberta. */
const ANEXO_MAX = 5 * 1048576;                       // tamanho máximo de um arquivo anexado
const CAPA_MAX = [360, 540];                         // a capa enviada é reduzida para caber nisto (largura × altura, em pixels)
const fTam = n => (n < 1024 ? `${n} B` : n < 1048576 ? `${fInt(Math.round(n / 1024))} KB` : `${fDec(n / 1048576)} MB`);
const novaChave = () => (Date.now().toString(36) + Math.random().toString(36).slice(2, 10)).slice(0, 18);
const ehTexto = (nome, mime) => /^text\//i.test(mime || '') || /\.(txt|md|markdown|csv|tsv|json|log|tex|rst|org|htm|html|xml|ya?ml)$/i.test(nome || '');

const Anexos = {
  capas: new Map(),        // chave → imagem (data:…) das capas enviadas, já na memória: a tela se desenha sem esperar pelo banco
  mem: new Map(),          // sem IndexedDB: os anexos ficam aqui, só enquanto a página está aberta
  banco: null,
  abrir() {                // promessa do banco aberto — ou de null, se o navegador não deixa gravar
    if (!this.banco) this.banco = new Promise(res => {
      if (!Loja.ok) { res(null); return; }
      const tentar = (versao, vezes) => {
        let p; try { p = versao ? indexedDB.open('biblioteca-lucas', versao) : indexedDB.open('biblioteca-lucas'); } catch (e) { res(null); return; }
        p.onupgradeneeded = () => { if (!p.result.objectStoreNames.contains('anexos')) p.result.createObjectStore('anexos', { keyPath: 'k' }); };
        p.onsuccess = () => {
          const db = p.result;
          // um banco com este nome, mas sem a tabela (criado por outra página do mesmo endereço): sobe a versão para criá-la
          if (!db.objectStoreNames.contains('anexos')) { const v = db.version + 1; db.close(); if (vezes > 2) res(null); else tentar(v, vezes + 1); return; }
          db.onversionchange = () => { db.close(); this.banco = null; };     // outra aba vai mexer na estrutura: solta o banco e reabre no próximo uso
          res(db);
        };
        p.onerror = () => res(null);
      };
      tentar(0, 0);
    });
    return this.banco;
  },
  async op(modo, f) {      // roda f(tabela) numa transação e devolve o que os pedidos trouxeram
    const db = await this.abrir();
    return new Promise((res, rej) => {
      let r; const tx = db.transaction('anexos', modo);
      tx.oncomplete = () => res(Array.isArray(r) ? r.map(p => p.result) : r ? r.result : undefined);
      tx.onerror = tx.onabort = () => rej(tx.error || new Error('o navegador recusou a gravação'));
      try { r = f(tx.objectStore('anexos')); } catch (e) { rej(e); }
    });
  },
  async gravar(reg) { if (await this.abrir()) await this.op('readwrite', t => t.put(reg)); else this.mem.set(reg.k, reg); },
  async varios(chaves) { if (!chaves.length) return []; return (await this.abrir()) ? this.op('readonly', t => chaves.map(k => t.get(k))) : chaves.map(k => this.mem.get(k)); },
  async ler(k) { return (await this.varios([k]))[0] || null; },
  async chaves() { return (await this.abrir()) ? this.op('readonly', t => t.getAllKeys()) : [...this.mem.keys()]; },
  async apagar(chaves) { for (const k of chaves) { this.capas.delete(k); this.mem.delete(k); } if (chaves.length && (await this.abrir())) await this.op('readwrite', t => { chaves.forEach(k => t.delete(k)); }); },
  async limpar() { this.capas.clear(); this.mem.clear(); if (await this.abrir()) await this.op('readwrite', t => { t.clear(); }); },
};
const chavesDe = b => (b.cp ? [b.cp] : []).concat((b.anx || []).map(a => a[0]));
/* traz para a memória as capas enviadas pelo usuário e redesenha a tela quando elas chegam */
async function carregarCapas() {
  const quero = [...new Set(DB.livros.map(b => b.cp).filter(Boolean))]; Anexos.capas.clear();
  if (!quero.length) return;
  let n = 0;
  try { for (const r of await Anexos.varios(quero)) if (r && r.tipo === 'capa' && typeof r.dados === 'string' && /^data:image\//.test(r.dados)) { Anexos.capas.set(r.k, r.dados); n++; } } catch (e) { /* sem o banco, ficam as capas do catálogo */ }
  if (n) { render(); if (Gaveta.id) desenharGaveta(); }
}

/* ───────── arquivos: ler, reduzir, mostrar, baixar ───────── */
const lerArquivo = arq => new Promise((res, rej) => { const l = new FileReader(); l.onload = () => res(String(l.result)); l.onerror = () => rej(l.error || new Error('leitura')); l.readAsDataURL(arq); });
/* imagem escolhida → JPEG pequeno (data:…), do tamanho de uma capa: cabe no navegador e abre na hora */
async function reduzirImagem(arq) {
  const url = URL.createObjectURL(arq);
  try {
    const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('imagem')); i.src = url; });
    const w = im.naturalWidth, h = im.naturalHeight; if (!w || !h) throw new Error('imagem');
    const k = Math.min(1, CAPA_MAX[0] / w, CAPA_MAX[1] / h), cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
    const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);     // fundo branco: o JPEG não tem transparência
    g.imageSmoothingQuality = 'high'; g.drawImage(im, 0, 0, cv.width, cv.height);

const bytesDe = dados => { const bin = atob(dados.slice(dados.indexOf(',') + 1)), v = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) v[i] = bin.charCodeAt(i); return v; };
/* conteúdo de um anexo de texto. UTF-8 é o comum; arquivos antigos do Windows vêm em UTF-16 ou em Windows-1252 */
function textoDoAnexo(dados) {
  const v = bytesDe(dados);
  if (v[0] === 0xFF && v[1] === 0xFE) return new TextDecoder('utf-16le').decode(v.subarray(2));
  if (v[0] === 0xFE && v[1] === 0xFF) return new TextDecoder('utf-16be').decode(v.subarray(2));
  try { return new TextDecoder('utf-8', { fatal: true }).decode(v); } catch (e) { return new TextDecoder('windows-1252').decode(v); }
}
function baixarAnexo(nome, dados) {
  if (!Loja.ok) { toast('Esta pré-visualização bloqueia downloads. No painel aberto no navegador o arquivo baixa normalmente.', 'aviso'); return; }
  const tipo = (/^data:([^;,]*)/.exec(dados) || [])[1] || 'application/octet-stream';
  const url = URL.createObjectURL(new Blob([bytesDe(dados)], { type: tipo })), a = document.createElement('a');

/* ───────── backup: os anexos vão e voltam junto com os livros ───────── */
async function exportarBackup() {
  const o = serializar(cfgAtual()), chaves = DB.livros.flatMap(chavesDe);
  try { o.anexos = (await Anexos.varios(chaves)).filter(Boolean).map(r => ({ k: r.k, livro: r.livro, tipo: r.tipo, nome: r.nome, mime: r.mime, tam: r.tam, dia: r.dia, dados: r.dados })); }
  catch (e) { toast('Não foi possível ler as capas e os arquivos anexados: este backup leva só os dados dos livros.', 'aviso'); }   // sem o campo `anexos`, importar este arquivo não mexe nos anexos que estão no navegador
  baixarArquivo(`biblioteca-lucas-backup-${iso(DB.hoje)}.json`, JSON.stringify(o), 'application/json');
}
/* anexos de um arquivo de backup: só passa o que está inteiro (nada aqui confia no formato) */
function lerAnexos(lista) {
  const out = [], vistos = new Set(), txt = (v, n) => (typeof v === 'string' ? v.slice(0, n) : '');
  for (const r of Array.isArray(lista) ? lista : []) {
    if (!r || typeof r !== 'object' || !chaveAnexo(r.k) || vistos.has(r.k) || typeof r.dados !== 'string' || r.dados.length > ANEXO_MAX * 1.4 + 400) continue;
    const tipo = r.tipo === 'capa' ? 'capa' : 'arquivo', ini = r.dados.slice(0, 200);
    if (!(tipo === 'capa' ? /^data:image\/(jpeg|png|webp|gif);base64,/ : /^data:[^,]{0,120};base64,/).test(ini)) continue;
    vistos.add(r.k);
    out.push({ k: r.k, livro: txt(r.livro, 40), tipo, nome: txt(r.nome, 120), mime: txt(r.mime, 80), tam: typeof r.tam === 'number' && isFinite(r.tam) && r.tam >= 0 ? Math.round(r.tam) : 0, dia: typeof r.dia === 'number' && isFinite(r.dia) ? Math.round(r.dia) : null, dados: r.dados });

/* Depois de trocar os livros pelos de um backup: os anexos do arquivo substituem os que estavam no navegador.
   Um backup sem o campo `anexos` (feito por um painel antigo, ou quando o banco não pôde ser lido) não mexe neles.
   No fim, nenhum livro fica apontando para um anexo que não existe. */
async function restaurarAnexos(o) {
  let existentes;
  try {
    if (Array.isArray(o.anexos)) { const lista = lerAnexos(o.anexos); await Anexos.limpar(); for (const r of lista) await Anexos.gravar(r); existentes = new Set(lista.map(r => r.k)); }
    else existentes = new Set(await Anexos.chaves());
  } catch (e) { existentes = new Set(); toast('As capas e os arquivos do backup não puderam ser guardados neste navegador.', 'aviso'); }
  let mudou = false;
  for (const b of DB.livros) {
    if (b.cp && !existentes.has(b.cp)) { b.cp = ''; mudou = true; }
    if (b.anx && b.anx.some(a => !existentes.has(a[0]))) { b.anx = b.anx.filter(a => existentes.has(a[0])); if (!b.anx.length) b.anx = null; derivar(b); mudou = true; }
  }
  if (mudou) salvar();
  // o que sobrou no banco e nenhum livro usa (anexos dos dados que acabaram de ser substituídos) sai
  const usados = new Set(DB.livros.flatMap(chavesDe));
  Anexos.apagar([...existentes].filter(k => !usados.has(k))).catch(() => {});
  await carregarCapas();
  render(); if (Gaveta.id) desenharGaveta();
}

/* ───────────────────────── gaveta do livro, diálogos e ações ───────────────────────── */
function toast(msg, tipo) {

  el.innerHTML = `${icone(tipo === 'aviso' ? 'info' : tipo === 'erro' ? 'fechar' : 'check', 15)}<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);

}
/* valor digitado → número (null se vazio, NaN se não der para entender). Aceita "45", "45,9", "R$ 1.234,56", "45.90";
   ponto seguido de exatamente três dígitos é milhar, como se escreve no Brasil ("1.250" = mil duzentos e cinquenta). */
const lerValor = s => {
  s = String(s ?? '').replace(/[R$\s]/g, ''); if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return /^(\d+\.?\d*|\.\d+)$/.test(s) ? Math.round(parseFloat(s) * 100) / 100 : NaN;
};
const valorCampo = v => (v == null ? '' : String(v.toFixed(2)).replace('.', ','));

/* ───────── foco nas camadas (gaveta, diálogo e folha de filtros) ─────────
   Ao abrir, o foco entra na camada; o Tab circula só dentro dela; ao fechar, volta para onde estava.
   focar() insiste por alguns quadros porque um elemento que ainda está invisível (transição de abertura) recusa o foco. */
function focar(el, tentativas = 10) {
  if (!el || !document.contains(el)) return;
  try { el.focus({ preventScroll: true }); } catch (e) { /* nada */ }
  if (document.activeElement !== el && tentativas > 0) setTimeout(() => focar(el, tentativas - 1), 30);
}
const FOCAVEIS = 'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
document.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const camada = $('#dlg.on .dlg-cx') || $('#gaveta.on .gv-p') || $('#filtros.folha #f-painel'); if (!camada) return;
  const itens = $$(FOCAVEIS, camada).filter(x => x.getClientRects().length), at = document.activeElement;
  if (!itens.length) { e.preventDefault(); return; }
  const pri = itens[0], ult = itens[itens.length - 1];
  if (!camada.contains(at) || (e.shiftKey ? at === pri || at === camada : at === ult)) { e.preventDefault(); (e.shiftKey ? ult : pri).focus(); }
});

function importarBackup(arquivo) {
  const leitor = new FileReader();

    let o; try { o = JSON.parse(String(leitor.result)); } catch (e) { o = null; }
    const livros = o && typeof o === 'object' && o.app === 'biblioteca-lucas' ? lerLivros(o.livros) : [];
    if (!livros.length) { toast('Este arquivo não é um backup válido do painel.', 'erro'); return; }
    const fora = o.livros.length - livros.length, quando = typeof o.salvoEm === 'string' && !isNaN(Date.parse(o.salvoEm)) ? ' · salvo em ' + esc(new Date(o.salvoEm).toLocaleString('pt-BR')) : '';
    const anexos = Array.isArray(o.anexos) ? lerAnexos(o.anexos).length : 0;
    confirmar('Importar backup', `Substituir os dados atuais pelos do arquivo <b>${esc(arquivo.name)}</b>?<br>${plural(livros.length, 'livro', 'livros')}${anexos ? ' · ' + plural(anexos, 'anexo (capa ou arquivo)', 'anexos (capas e arquivos)') : ''}${quando}${fora ? ` · ${plural(fora, 'registro ilegível será ignorado', 'registros ilegíveis serão ignorados')}` : ''}. Esta ação não pode ser desfeita.`, 'Importar', () => {
      fecharGaveta();                         // antes de trocar os livros: o comentário em edição pertence aos dados que estão saindo
      DB.livros = livros; DB.exemplos = !!o.exemplos; DB.criadoEm = typeof o.criadoEm === 'number' && isFinite(o.criadoEm) ? o.criadoEm : DB.hoje; S.sel = '';
      ajustarAoCatalogo(o.cat);
      salvar(); filtrosMudaram(); toast('Backup importado.' + textoNovidade());
      restaurarAnexos(o);                     // capas enviadas e arquivos anexados: os do backup substituem os do navegador
    });
  };
  leitor.readAsText(arquivo);
}

function tocar(b) {                            // o item passa a ser "do usuário": não é mais tratado como exemplo
  marcarMeu(b); marcarPosse(b); defTag(b, 'lido', b.leit === 'lido'); derivar(b);
  salvar(); render(); if (Gaveta.id === b.id) desenharGaveta();
}
function registrarCotacao(b, loja, preco, d) {
  if (!b.px) b.px = {};
  const pts = b.px[loja] || (b.px[loja] = []), i = pts.findIndex(p => p[0] === d);
  if (i >= 0) pts[i] = [d, preco, 1]; else { pts.push([d, preco, 1]); pts.sort((a, z) => a[0] - z[0]); }
  if (b.col !== 'acervo') b.track = true;
  salvar(); render(); if (Gaveta.id === b.id) desenharGaveta();
}
function apagarCotacao(b, loja, d) {            // só as cotações do usuário (as de exemplo saem em "Limpar dados de exemplo")
  const pts = b.px && b.px[loja], i = pts ? pts.findIndex(p => p[0] === d && p[2]) : -1; if (i < 0) return;
  const p = pts[i];
  confirmar('Apagar cotação', `Apagar a cotação de <b>${fBRL(p[1])}</b> em ${esc(loja)}, de ${fData(d)}?`, 'Apagar', () => {
    pts.splice(i, 1); if (!pts.length) delete b.px[loja];
    if (!Object.keys(b.px).length) { b.px = null; if (b.col === 'rec') b.track = false; }
    salvar(); render(); if (Gaveta.id === b.id) desenharGaveta(); toast('Cotação apagada.');

}

  if (a === 'comprei') dlgComprei(b, false);

  else if (a === 'progresso') dlgProgresso(b);

  else if (a === 'cotar') dlgCotacao(b);
  else if (a === 'parar') { b.track = false; tocar(b); toast('Monitoramento pausado. O histórico foi mantido.'); }
  else if (a === 'monitorar') { b.track = true; tocar(b); toast('Preço em monitoramento.'); }

  else if (a === 'excluir') confirmar('Excluir livro', `Excluir <b>${esc(b.t)}</b> do painel? Esta ação não pode ser desfeita.`, 'Excluir', () => { fecharGaveta(); Anexos.apagar(chavesDe(b)).catch(() => {}); DB.livros = DB.livros.filter(x => x !== b); salvar(); render(); toast('Livro excluído.'); }, true);
}

  for (const e of S.ext) add('ext:' + e, 'Extensão ' + EXTENSOES[e].n.toLowerCase());

  if (S.periodo !== 'tudo') add('periodo:', custom ? `${fData(I.de)} – ${fData(I.ate)}` : 'Período: ' + (PERIODOS.find(([v]) => v === S.periodo) || ['', ''])[1].toLowerCase());
  const el = $('#f-ativos'); el.hidden = !ch.length;
  setHtml(el, ch.length ? `<span class="fa-r">Filtros ativos</span>${ch.join('')}${ch.length > 1 ? '<button type="button" class="lk" data-limpar="tudo">limpar tudo</button>' : ''}` : '');
}

/* ───────── casca: navegação, cabeçalho, avisos ───────── */
function pintarStatus(ok) {
  const el = $('#st-dados'); if (!el) return;
  const bom = Loja.ok && ok !== false;
  el.className = 'st ' + (bom ? 'ok' : 'aviso');
  el.innerHTML = `<i></i><span><b>${bom ? 'Salvo neste navegador' : Loja.ok ? 'Não foi possível salvar' : 'Pré-visualização'}</b><em>${bom ? 'dados só neste dispositivo' : Loja.ok ? 'armazenamento cheio ou bloqueado' : 'alterações não são salvas'}</em></span>`;
  el.title = 'Seus dados: backup, importação e dados de exemplo';
}
function pintarCasca(c) {
  $('#b-exemplo').hidden = !DB.exemplos;
  const av = $('#aviso'), mostrar = !S.avisoVisto;
  av.classList.toggle('inicio', !DB.exemplos);
  // sem exemplos: um recado, uma vez, dizendo de onde vêm os números e como registrar o resto.
  // S.saiu > 0: os exemplos de um painel antigo acabaram de sair (S.saiu - 1 = quantos livros editados ficaram como estavam)
  if (mostrar && !DB.exemplos) {
    const como = 'Leituras, datas e valores aparecem conforme você registra: abra um livro e use <b>Já li</b>, <b>Começar a ler</b> ou <b>Editar</b>. Nada disso é obrigatório — nem as datas.';
    const meus = S.saiu > 1 ? S.saiu - 1 : 0;
    setHtml(av, `<span class="av-i">${icone('info', 18)}</span><div>` + (S.saiu
      ? `<b>Os dados de exemplo saíram.</b><p>As leituras, datas e valores inventados que o painel mostrava foram retirados: agora só aparece o que é seu. ${como}</p>` +
        (meus ? `<p>${meus === 1 ? 'O livro que você criou ou editou' : 'Os ' + fInt(meus) + ' livros que você criou ou editou'} enquanto os exemplos estavam ligados <b>${meus === 1 ? 'ficou como estava' : 'ficaram como estavam'}</b>: ${meus === 1 ? 'pode' : 'podem'} trazer datas ou valores de exemplo misturados ao que você anotou. Se eram só testes, use <b>Recomeçar do catálogo original</b>, em <b>Seus dados</b>.</p>` : '')
      : `<b>Aqui só aparece o que é seu.</b><p>Os ${fInt(DB.livros.filter(b => b.sec >= 0).length)} títulos, a estante física e a biblioteca virtual vieram do seu catálogo. ${como}</p>`) +
      `</div><div class="av-a">${meus ? `<button type="button" class="btn sm" data-av="meus">Ver ${meus === 1 ? 'esse livro' : 'esses livros'}</button>` : ''}<button type="button" class="btn sm pri" data-av="ok">Entendi</button></div>`);
  }
  av.hidden = !mostrar;
  if (mostrar && DB.exemplos) setHtml(av, `<span class="av-i">${icone('info', 18)}</span><div><b>Seu catálogo é real; o movimento é de exemplo.</b><p>Os ${fInt(DB.livros.filter(b => b.sec >= 0).length)} títulos, autores, marcadores, eixos, a estante física e a biblioteca virtual vieram do seu catálogo. Datas e valores pagos, leituras, a lista de próximas aquisições e os históricos de preço são <b>simulados</b> para dar vida aos gráficos, e os preços não vêm das lojas: entram por cotações que você registra.</p></div><div class="av-a"><button type="button" class="btn sm" data-av="dados">Gerenciar dados</button><button type="button" class="btn sm pri" data-av="ok">Entendi</button></div>`);
  $('#rodape-n').textContent = `${plural(DB.livros.length, 'livro', 'livros')} · ${c.I.tudo ? 'todo o histórico' : c.I.rot}${nFiltros() ? ' · ' + plural(nFiltros(), 'filtro ativo', 'filtros ativos') : ''}`;
}
function aplicarTema() {
  const t = S.tema || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro');
  document.documentElement.dataset.tema = t;
  const b = $('#b-tema'); b.innerHTML = icone(t === 'escuro' ? 'sol' : 'lua'); b.setAttribute('aria-label', t === 'escuro' ? 'Usar tema claro' : 'Usar tema escuro'); b.title = b.getAttribute('aria-label');
  const m = $('meta[name="theme-color"]'); if (m) m.content = t === 'escuro' ? '#141310' : '#F5F3EE';
}
function aplicarOlho() {
  OCULTAR_VALORES = S.ocultar;
  const b = $('#b-olho'); b.innerHTML = icone(S.ocultar ? 'olhoOff' : 'olho'); b.setAttribute('aria-pressed', String(S.ocultar)); b.setAttribute('aria-label', S.ocultar ? 'Mostrar valores em reais' : 'Ocultar valores em reais'); b.title = b.getAttribute('aria-label');
}
function montarCasca() {
  const item = v => `<button type="button" data-ir="${v}">${icone(VISOES[v].ic, 19)}<span class="nv-l">${VISOES[v].n}</span><span class="nv-c">${VISOES[v].c}</span></button>`;
  $('#nav').innerHTML = ORDEM_VISOES.map(item).join(''); $('#nav-m').innerHTML = ORDEM_VISOES.map(item).join('');
  $('#b-dados').innerHTML = icone('dados'); $('#b-novo').innerHTML = icone('mais', 16) + '<span>Novo livro</span>';
  document.addEventListener('click', e => {
    const ir = e.target.closest('[data-ir]'); if (ir) { irPara(ir.dataset.ir); return; }
    const li = e.target.closest('.li[data-id]'); if (li) { abrirLivro(li.dataset.id); return; }
    const sl = e.target.closest('[data-sel]'); if (sl) { selecionarPreco(sl.dataset.sel); return; }
    const av = e.target.closest('[data-av]'); if (av) {
      if (av.dataset.av === 'ok') { S.avisoVisto = true; S.saiu = 0; salvar(); pintarCasca(ctxAtual()); }
      else if (av.dataset.av === 'meus') verEditados();
      else dlgDados();
    }
  });
  $('#b-tema').addEventListener('click', () => { S.tema = document.documentElement.dataset.tema === 'escuro' ? 'claro' : 'escuro'; aplicarTema(); salvar(); });
  $('#b-olho').addEventListener('click', () => { S.ocultar = !S.ocultar; aplicarOlho(); salvar(); render(); if (Gaveta.id) desenharGaveta(); });
  $('#b-dados').addEventListener('click', dlgDados); $('#st-dados').addEventListener('click', dlgDados); $('#b-exemplo').addEventListener('click', dlgDados);
  $('#b-novo').addEventListener('click', () => dlgLivro(null));
  $('#arq').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importarBackup(f); e.target.value = ''; });
  $('#dlg').addEventListener('click', e => { if (e.target.closest('[data-fechar]')) { Dlg.fechar(); return; } const b = e.target.closest('footer [data-b]'); if (b) Dlg.acionar(+b.dataset.b); });
  $('#dlg').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && !e.target.closest('.cot') && e.target.type !== 'checkbox') { const i = Dlg.botoes.findIndex(b => /pri|perigo/.test(b.cls || '')); if (i >= 0) { e.preventDefault(); Dlg.acionar(i); } } });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if ($('#dlg').classList.contains('on')) Dlg.fechar(); else if ($('.pop-w.aberto')) fecharPops(); else if ($('#filtros').classList.contains('folha')) folha(false);
      else if (!$('#q-r').hidden) fecharBusca(); else if ($('#gaveta').classList.contains('on')) fecharGaveta();
    } else if (e.key === '/' && !e.ctrlKey && !e.metaKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !$('.dlg.on')) { e.preventDefault(); $('#q').focus(); }
  });
  window.addEventListener('scroll', () => Tip.ocultar(), { passive: true });
  document.addEventListener('scroll', e => { const t = e.target; if (t && t.classList && t.classList.contains('rolavel')) marcarRolagem(t); }, { passive: true, capture: true });
  montarBusca();
}

/* ───────── busca rápida ───────── */
const fecharBusca = () => { $('#q-r').hidden = true; $('#q').setAttribute('aria-expanded', 'false'); };
function montarBusca() {
  const q = $('#q'), r = $('#q-r'); let foco = -1, itens = [];
  const pintar = () => {
    const txt = norm(q.value.trim()), termos = txt.split(/\s+/).filter(Boolean);
    if (!termos.length) { fecharBusca(); return; }
    const nota = b => { const t = norm(b.t), a = norm(b.a); return t.startsWith(txt) ? 0 : t.includes(txt) ? 1 : a.includes(txt) ? 2 : 3; };
    const achados = DB.livros.filter(b => termos.every(t => b._busca.includes(t)));
    itens = achados.map(b => [b, nota(b)]).sort((a, z) => a[1] - z[1] || a[0].t.localeCompare(z[0].t, 'pt-BR')).slice(0, 8).map(x => x[0]);
    foco = itens.length ? 0 : -1;
    r.innerHTML = itens.length ? itens.map((b, i) => `<button type="button" role="option" class="qr${i === foco ? ' foco' : ''}" data-id="${b.id}"><span class="tt"><b>${esc(b.t)}</b><span>${esc(b.a || 'Autor não informado')}</span></span><span class="pill col-${b.col}">${COLECOES[b.col].n}</span></button>`).join('') + (achados.length > itens.length ? `<span class="qr-n">+ ${fInt(achados.length - itens.length)} resultados · refine a busca ou use o filtro da tabela</span>` : '') : '<span class="qr-n">Nenhum livro encontrado.</span>';
    r.hidden = false; q.setAttribute('aria-expanded', 'true');
  };
  const abrir = id => { fecharBusca(); q.value = ''; q.blur(); abrirLivro(id); };
  q.addEventListener('input', debounce(pintar, 90));
  q.addEventListener('focus', () => { if (q.value.trim()) pintar(); });
  q.addEventListener('keydown', e => {
    if (r.hidden || !itens.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); foco = (foco + (e.key === 'ArrowDown' ? 1 : -1) + itens.length) % itens.length; $$('.qr', r).forEach((el, i) => el.classList.toggle('foco', i === foco)); }
    else if (e.key === 'Enter' && foco >= 0) { e.preventDefault(); abrir(itens[foco].id); }
  });
  r.addEventListener('click', e => { const b = e.target.closest('.qr'); if (b) abrir(b.dataset.id); });
  document.addEventListener('pointerdown', e => { if (!e.target.closest('#busca')) fecharBusca(); });
}

/* ───────── início ───────── */
function iniciar() {
  const cfg = carregarDB();
  // enquanto nada foi editado, os exemplos acompanham a data de hoje (assim os gráficos nunca "envelhecem")
  if (DB.exemplos && DB.criadoEm !== DB.hoje && !DB.livros.some(b => b.u || temCotacaoPropria(b))) { DB.livros = gerarExemplos(livrosDoCatalogo(), DB.hoje); DB.criadoEm = DB.hoje; }
  S.tema = cfg.tema === 'claro' || cfg.tema === 'escuro' ? cfg.tema : ''; S.ocultar = !!cfg.ocultar; S.avisoVisto = !!cfg.avisoVisto;
  S.capas = cfg.capas !== false; MOSTRAR_CAPAS = S.capas;
  // os exemplos de um painel antigo acabaram de sair: o recado inicial volta, agora contando isso, e fica até o "Entendi"
  S.saiu = DB.saiuExemplo || (cfg.saiu > 0 && !DB.exemplos ? Math.round(+cfg.saiu) || 0 : 0);
  if (DB.saiuExemplo) S.avisoVisto = false;
  // imagem de capa que não carregou (sem rede, capa retirada do ar): some, e fica o desenho com a inicial do título
  document.addEventListener('error', e => { const im = e.target; if (im && im.tagName === 'IMG' && im.parentElement && im.parentElement.classList.contains('capa')) { const c = im.parentElement; if (c.classList.contains('g')) c.remove(); else im.remove(); } }, true);
  if (cfg.visao && VISOES[cfg.visao]) S.visao = cfg.visao;
  if (cfg.ui && typeof cfg.ui === 'object') Object.assign(S.ui, cfg.ui);
  if (cfg.tam) for (const k in cfg.tam) if (TABELAS[k] && [10, 25, 50, 100].includes(cfg.tam[k])) S.tab[k] = { tam: cfg.tam[k] };
  montarCasca(); montarFiltros(); montarGaveta(); aplicarTema(); aplicarOlho(); pintarStatus(true);
  if (window.matchMedia) { const mq = matchMedia('(prefers-color-scheme: dark)'), f = () => { if (!S.tema) aplicarTema(); }; if (mq.addEventListener) mq.addEventListener('change', f); }
  irPara(S.visao, true);
  document.documentElement.classList.add('pronto');
  carregarCapas();                                  // capas enviadas pelo usuário: chegam do banco do navegador e a tela é redesenhada
  // a página vai sair de cena (aba fechada, outro aplicativo no telefone): grava o comentário em edição e o que estiver pendente
  const fechando = () => { Notas.guardar(); if (SUJO) gravarJa(); };
  window.addEventListener('pagehide', fechando);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') fechando(); });
  // o painel chegou com outro catálogo: os dados salvos já foram conciliados (ver conciliarCatalogo); grava e avisa
  if (DB.novidade) { salvar(); if (textoNovidade()) toast(textoNovidade().trim() + ' O que você editou no painel foi mantido.'); }
  // os dados de exemplo de um painel antigo saíram (ver carregarDB): grava e avisa
  if (DB.saiuExemplo) { salvar(); toast('Os dados de exemplo saíram: agora o painel mostra só o que é seu.'); }
  try { if (sessionStorage.getItem('bl-falha')) { sessionStorage.removeItem('bl-falha'); toast('Os dados salvos não puderam ser abertos e o painel recomeçou do catálogo. A cópia do que havia está em “Seus dados”.', 'aviso');
    // a recarga da rede de segurança abre no topo (ver abaixo); depois disso a rolagem volta a ser lembrada pelo navegador
    const volta = () => setTimeout(() => { try { history.scrollRestoration = 'auto'; } catch (e) { /* nada */ } }, 600);
    if (document.readyState === 'complete') volta(); else window.addEventListener('load', volta, { once: true });
  } } catch (e) { /* nada */ }
}
try { iniciar(); }
catch (erro) {
  // Rede de segurança: se os dados salvos impedirem a abertura, guarda uma cópia e recomeça do catálogo (em vez de uma tela em branco).
  let bruto = null; try { bruto = localStorage.getItem(CHAVE); } catch (e) { /* sem armazenamento */ }
  if (bruto) { try { localStorage.setItem(CHAVE + ':falha', bruto); sessionStorage.setItem('bl-falha', '1'); } catch (e) { /* sem espaço: segue sem a cópia */ }
    // o aviso inicial volta a aparecer e empurraria a página: sem isto o navegador "restaura" a rolagem no meio do painel
    try { history.scrollRestoration = 'manual'; } catch (e) { /* nada */ }
    try { localStorage.removeItem(CHAVE); location.reload(); } catch (e) { /* nada */ } }
  else { document.documentElement.classList.add('pronto'); throw erro; }
}

})();
</script>
