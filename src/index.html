<!doctype html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F3EE">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Painel pessoal da biblioteca física e virtual, recomendações, próximas aquisições e preços. O catálogo é público; anotações, leituras e preços ficam só no navegador de quem os registrou.">
<title>Biblioteca do Lucas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23B4502A'/%3E%3Cpath d='M8 9h5.5a3 3 0 0 1 2.5 1.4A3 3 0 0 1 18.5 9H24v13h-5.5a3 3 0 0 0-2.5 1.3A3 3 0 0 0 13.5 22H8z' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>try{var c=JSON.parse(localStorage.getItem('biblioteca-lucas:v1')||'{}').cfg||{};}catch(e){var c={};}document.documentElement.dataset.tema=['claro','escuro','lovecraft','holmes','moby','deserto','terras','greco'].indexOf(c.tema)>=0?c.tema:(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'escuro':'claro');</script>
<style>
/*__CSS__*/
</style>
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<div class="app" id="app">
  <aside class="lateral" aria-label="Navegação principal">
    <div class="marca">
      <span class="marca-i" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg></span>
      <span class="marca-t"><b>Biblioteca</b><em>do Lucas</em></span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="lat-pe">
      <button type="button" class="st" id="st-dados"></button>
    </div>
  </aside>

  <div class="principal">
    <header class="topo">
      <div class="topo-t">
        <span class="marca-i so-m" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg></span>
        <div><h1 id="titulo">Visão geral</h1><p id="descricao"></p></div>
      </div>
      <div class="topo-a">
        <div class="busca" id="busca" role="search">
          <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="q" type="search" placeholder="Buscar livro, autor ou tema" autocomplete="off" spellcheck="false" aria-label="Busca rápida de livros" role="combobox" aria-expanded="false" aria-controls="q-r">
          <kbd aria-hidden="true">/</kbd>
          <div class="busca-r" id="q-r" role="listbox" hidden></div>
        </div>
        <button type="button" class="pill-ex" id="b-exemplo" hidden title="Parte dos dados é simulada. Clique para gerenciar.">Dados de exemplo</button>
        <button type="button" class="ib" id="b-olho"></button>
        <span class="pop-w tema-w" id="pw-tema"><button type="button" class="ib pop-b" id="b-tema" aria-expanded="false" aria-controls="pop-tema"></button><div class="pop tema-pop" id="pop-tema" role="group" aria-label="Aparência"></div></span>
        <button type="button" class="ib" id="b-dados" aria-label="Seus dados: backup e dados de exemplo" title="Seus dados: backup e dados de exemplo"></button>
        <button type="button" class="btn pri" id="b-novo" aria-label="Novo livro"></button>
      </div>
    </header>

    <div class="filtros" id="filtros" aria-label="Filtros"></div>
    <div class="aviso" id="aviso" role="note" hidden></div>

    <main id="conteudo" tabindex="-1">
      <section class="visao" id="v-geral" aria-label="Visão geral" hidden></section>
      <section class="visao" id="v-biblioteca" aria-label="Biblioteca" hidden></section>
      <section class="visao" id="v-recs" aria-label="Recomendações" hidden></section>
      <section class="visao" id="v-financas" aria-label="Finanças" hidden></section>
      <section class="visao" id="v-desejos" aria-label="Próximas aquisições" hidden></section>
      <section class="visao" id="v-precos" aria-label="Preços" hidden></section>
    </main>

    <footer class="rodape">
      <span id="rodape-n"></span>
      <span>Painel pessoal · os dados ficam apenas neste dispositivo · nada do que você anota é enviado para a internet · as capas vêm da Open Library e da Apple Books</span>
    </footer>
  </div>

  <nav class="inferior" id="nav-m" aria-label="Navegação principal"></nav>
</div>

<div class="tip" id="tip" role="tooltip"></div>
<div class="gaveta" id="gaveta" aria-hidden="true"></div>
<div class="dlg" id="dlg" aria-hidden="true"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="impressao" id="impressao" data-tema="claro" aria-hidden="true"></div>
<input type="file" id="arq" accept=".json,application/json" hidden>
<noscript><p style="padding:24px;font-family:sans-serif">Este painel precisa de JavaScript para funcionar.</p></noscript>
<script>
/*__JS__*/
</script>
</body>
</html>
